name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests with coverage
        env:
          APP_PASSWORD: ci-test-password
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml -q backend/tests
      - name: Lint Python
        run: ruff check backend
      - name: Type-check Python
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: "1"
        run: pyright backend
      - name: Scan Python security
        run: bandit -r backend -ll

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend for E2E API
        run: pip install -r backend/requirements.txt
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend for browser tests
        env:
          APP_PASSWORD: e2e-test-password
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DATA_DIR: /tmp/letsrenew-e2e-data
        run: |
          mkdir -p "$DATA_DIR"
          PYTHONPATH=backend uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/letsrenew-api.log 2>&1 &
          echo $! > /tmp/letsrenew-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail -H "Authorization: Bearer $APP_PASSWORD" http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/letsrenew-api.log
          exit 1
      - name: Run Playwright E2E specs
        working-directory: frontend
        env:
          E2E_PASSWORD: e2e-test-password
        run: npm run test:e2e
      - name: Build container
        run: docker build -t letsrenew:ci .

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          category: /language:python-javascript-typescript

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
