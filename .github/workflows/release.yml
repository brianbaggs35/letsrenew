name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish container
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            .
          docker push "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"
          docker push "${{ steps.image.outputs.name }}:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping the existing release."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
