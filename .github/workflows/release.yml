name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish container
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build \
            -t "${{ steps.image.outputs.name }}:${RELEASE_TAG}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            .
          docker push "${{ steps.image.outputs.name }}:${RELEASE_TAG}"
          docker push "${{ steps.image.outputs.name }}:latest"
